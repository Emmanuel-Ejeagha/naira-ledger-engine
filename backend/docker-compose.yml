version: '3.9'

services:
  nairaledger.webapi:                # 👈 Must match the override file name
    build:
      context: .
      dockerfile: NairaLedger.WebApi/Dockerfile
    container_name: nairaledger-webapi
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=NairaLedgerDb;Username=nairawallet;Password=nairawallet_dev
      - Redis__ConnectionString=redis:6379
      - Jwt__Secret=your-256-bit-secret-change-me-in-production
      - Jwt__Issuer=NairaLedger
      - Jwt__Audience=NairaLedgerUsers
      - Paystack__SecretKey=sk_test_yourkey
      - Smtp__Host=smtp.mailtrap.io
      - Smtp__Port=587
      - Smtp__Username=your_mailtrap_user
      - Smtp__Password=your_mailtrap_pass
      - Smtp__FromAddress=no-reply@nairawallet.ng
      - Smtp__FromName=NairaLedger
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nairaledger-postgres
    environment:
      POSTGRES_DB: NairaLedgerDb
      POSTGRES_USER: nairawallet
      POSTGRES_PASSWORD: nairawallet_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nairawallet -d NairaLedgerDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nairaledger-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: